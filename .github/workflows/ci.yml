name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # SECURITY: restrict GITHUB_TOKEN permissions to least-privilege.
    # - contents: read — needed for checkout only.
    # - pull-requests: read — needed to post PR comments (if used).
    # Write permissions (issues, pull-requests write, deployments, etc.)
    # are NOT granted, preventing supply-chain privilege escalation.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: devlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next
            apps/web/node_modules/.cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install dependencies
        run: pnpm install

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && break
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run --coverage --reporter=verbose
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/devlens_test

      - name: Verify coverage report
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "ERROR: coverage/lcov.info not found!"
            exit 1
          fi
          echo "Coverage report found:"
          wc -l coverage/lcov.info

      # NOTE: SonarCloud CI analysis conflicts with "Automatic Analysis" (GitHub
      # App).  To use the CI scanner (which supports coverage reports), disable
      # Automatic Analysis in the SonarCloud project settings first:
      #   https://sonarcloud.io/organizations/monority/projects/monority_devlens/settings
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
